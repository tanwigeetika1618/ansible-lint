name: FlowForge Test Lint

on:
  push:
    branches: ["**"]

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run ruff
        run: |
          pip install ruff
          ruff check src/ansiblelint/ --select F401
