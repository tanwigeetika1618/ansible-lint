title: 'Ruff linter failure: Unused import (F401)'
trigger_type: lint_error
log_pattern: 'unused-import: `.*` imported but unused[\s\S]*Process completed with
  exit code 1\.'
cause: The CI build failed because the ruff linter detected an unused import statement
  (F401 error code) in the codebase. Specifically, the 'os' module was imported but
  not utilized.
fix_description: To resolve this, remove the unused import statement from the specified
  file. This will satisfy the ruff linter's requirements and allow the CI check to
  pass.
fix_steps:
- Navigate to the file indicated in the log (e.g., `src/ansiblelint/__init__.py`).
- Locate the line containing the unused import (e.g., `import os`).
- Delete or comment out the unused import statement.
- Commit your changes and push to trigger a new CI build.
